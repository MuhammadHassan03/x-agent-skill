name: algo-watch
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: algo-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Exit 0: nothing changed. 10: changes, validated and written. 2: file moved or parse failed.
      # 3: validation failed (weight key missing, non-numeric weight, or a weight moved more than 10x).
      # On 2 or 3 nothing is written and nothing is committed; an issue is opened instead.
      - name: Run algo_watch
        id: watch
        run: |
          set +e
          python tools/algo_watch.py --write --diff-out "$RUNNER_TEMP/algo-diff.md" 2> "$RUNNER_TEMP/algo-err.txt"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/algo-err.txt" >&2
          exit 0
      - name: Run the tests on the updated references
        if: steps.watch.outputs.code == '10'
        run: |
          python -m pip install pytest
          python -m pytest -q
      - name: Commit the validated change to the default branch
        if: steps.watch.outputs.code == '10'
        run: |
          date=$(date -u +%F)
          n=$(grep -m1 -oE '[0-9]+ changes?' "$RUNNER_TEMP/algo-diff.md" | grep -oE '^[0-9]+' || echo 0)
          sha=$(jq -r '.commit' references/weights.json)
          cdate=$(jq -r '.commit_date' references/weights.json)
          {
            echo "weights: $date, $n changes (upstream ${sha:0:7}, $cdate)"
            echo
            echo "Upstream commit: $sha"
            echo "Upstream commit date: $cdate"
            echo "Checks passed: weight keys all present, weight values numeric, no weight moved more than 10x."
            echo
            cat "$RUNNER_TEMP/algo-diff.md"
          } > "$RUNNER_TEMP/commit-msg.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references README.md
          git commit -s -F "$RUNNER_TEMP/commit-msg.txt"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
      - name: Open an issue, commit nothing (file moved, parse failed, or validation failed)
        if: steps.watch.outputs.code == '2' || steps.watch.outputs.code == '3'
        run: |
          open=$(gh issue list --state open --label algo-watch --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "An algo-watch issue is already open."
            exit 0
          fi
          gh label create algo-watch --description "Ranking-parameter tracker" --color 6e7681 2>/dev/null || true
          if [ "${{ steps.watch.outputs.code }}" = "3" ]; then
            title="algo-watch: validation failed, nothing committed ($(date -u +%F))"
            what="The weekly algo-watch run fetched param.rs but the update failed validation, so nothing was committed."
          else
            title="algo-watch: could not read param.rs ($(date -u +%F))"
            what="The weekly algo-watch run could not read param.rs, so nothing was committed."
          fi
          {
            echo "$what"
            echo
            echo '```'
            cat "$RUNNER_TEMP/algo-err.txt"
            echo '```'
            if [ -f "$RUNNER_TEMP/algo-diff.md" ]; then
              echo
              cat "$RUNNER_TEMP/algo-diff.md"
            fi
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "$title" --label algo-watch --body-file "$RUNNER_TEMP/issue.md"
