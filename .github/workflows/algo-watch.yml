name: algo-watch
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: algo-watch
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run algo_watch
        id: watch
        run: |
          set +e
          python tools/algo_watch.py --write --diff-out "$RUNNER_TEMP/algo-diff.md" 2> "$RUNNER_TEMP/algo-err.txt"
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/algo-err.txt" >&2
          exit 0
      - name: Run the tests on the updated references
        if: steps.watch.outputs.code == '10'
        run: |
          python -m pip install pytest
          python -m pytest -q
      - name: Commit the change to the default branch
        if: steps.watch.outputs.code == '10'
        run: |
          date=$(date -u +%F)
          n=$(grep -m1 -oE '[0-9]+ changes?' "$RUNNER_TEMP/algo-diff.md" | grep -oE '^[0-9]+' || echo 0)
          {
            echo "weights: $date, $n changes"
            echo
            cat "$RUNNER_TEMP/algo-diff.md"
          } > "$RUNNER_TEMP/commit-msg.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add references README.md
          git commit -s -F "$RUNNER_TEMP/commit-msg.txt"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
      - name: Open an issue when the file moved or the parse failed
        if: steps.watch.outputs.code == '2'
        run: |
          open=$(gh issue list --state open --label algo-watch --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "An algo-watch issue is already open."
            exit 0
          fi
          gh label create algo-watch --description "Ranking-parameter tracker" --color 6e7681 2>/dev/null || true
          {
            echo "The weekly algo-watch run failed."
            echo
            echo '```'
            cat "$RUNNER_TEMP/algo-err.txt"
            echo '```'
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "algo-watch: could not read param.rs ($(date -u +%F))" --label algo-watch --body-file "$RUNNER_TEMP/issue.md"
